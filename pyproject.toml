[project]
name = "digital-citizens"
version = "0.0.1"
description = "AI digital citizens: census-grounded, survey-anchored LLM personas with a validation harness that measures how faithfully they reproduce real populations and segments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=15",
  "scipy>=1.12",
  "scikit-learn>=1.4",
  "pydantic>=2.6",
  "anthropic>=0.40",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dc = "digital_citizens.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
